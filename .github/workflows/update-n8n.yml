name: Update n8n on Cloud Run

on:
  push:
    branches:
      - "user/yz"
  schedule:
    # At 12:00 AM, on day 1 of the month
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update-n8n:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: asia-southeast1
      REPO: n8n-repo
      IMAGE: n8n
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev

      - name: Build custom n8n image
        run: |
          docker build --platform linux/amd64 -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:latest .

      - name: Push image to Artifact Registry
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:latest

      - name: Redeploy Cloud Run service
        run: |
          gcloud run services update n8n \
            --image=$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$IMAGE:latest \
            --region=$REGION
